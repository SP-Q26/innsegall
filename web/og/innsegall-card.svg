<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Innsegall post-scare Mac triage">
  <defs>
    <linearGradient id="fjord" x1="600" y1="0" x2="600" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1D2E"/>
      <stop offset="0.55" stop-color="#071018"/>
      <stop offset="1" stop-color="#081521"/>
    </linearGradient>
    <linearGradient id="beam-wash" x1="600" y1="0" x2="600" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4C95D" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#A8D8FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="horn-beam" x1="80" y1="0" x2="80" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4C95D" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#A8D8FF" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="gold-pill" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F8D574"/>
      <stop offset="1" stop-color="#D4A84A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#fjord)"/>
  <rect width="1200" height="630" fill="url(#beam-wash)"/>
  <rect x="40" y="40" width="1120" height="550" rx="28" fill="none" stroke="#F4C95D" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Brand mark (paths only · matches site header horn) -->
  <g transform="translate(520 56) scale(4)">
    <rect width="40" height="40" rx="8" fill="#122A42"/>
    <rect x="1.5" y="1.5" width="37" height="37" rx="7" fill="none" stroke="#F4C95D" stroke-opacity="0.35" stroke-width="1"/>
    <path d="M20 6v28" stroke="url(#horn-beam)" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="20" cy="30" rx="8" ry="3" fill="#E8A87C" opacity="0.88"/>
    <path d="M14 22c2-4 10-4 12 0" stroke="#A8D8FF" stroke-width="1.5" fill="none" opacity="0.75"/>
  </g>

  <!-- Rune divider · vector strokes (no font glyphs) -->
  <g stroke="#3DAA8C" stroke-width="3" stroke-linecap="round" opacity="0.75">
    <path d="M548 248 L558 228 L568 248"/>
    <path d="M588 238 L598 218 L608 238"/>
    <path d="M628 248 L638 228 L648 248"/>
  </g>

  <text x="600" y="300" text-anchor="middle" fill="#F4E8C8" font-family="sans-serif" font-size="82" font-weight="600" letter-spacing="0.04em">Innsegall</text>
  <text x="600" y="358" text-anchor="middle" fill="#A8D8FF" font-family="sans-serif" font-size="34">Know you are okay</text>
  <text x="600" y="408" text-anchor="middle" fill="#8B9CB3" font-family="sans-serif" font-size="26">Post-scare Mac triage</text>
  <text x="600" y="446" text-anchor="middle" fill="#8B9CB3" font-family="sans-serif" font-size="22">Battle Scout receipts · local scout · not antivirus</text>

  <rect x="370" y="488" width="460" height="54" rx="27" fill="url(#gold-pill)"/>
  <text x="600" y="523" text-anchor="middle" fill="#0B1D2E" font-family="sans-serif" font-size="26">innsegall.com</text>
</svg>
